spring.application.name=medqr-backend
# --- Configuration de la Base de Données (PostgreSQL) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Le driver est nécessaire, bien que souvent déduit
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration d'Hibernate/JPA
# 'update' va créer les tables basées sur vos Entités (Models)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#configuration de hibernate bax t7awl mn camelCase l snack_case automatiquement mn l model l DB
spring.jpa.hibernate.naming.physical-strategy=com.medqr.backend.config.jpa.CustomPhysicalNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy

# --- Configuration de Sécurité JWT (Exemple, à compléter dans security/) ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}


# --- Configuration SMTP pour l'Envoi d'Emails ---
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Chemin d'accès pour stocker les fichiers médicaux
# Sur Linux/Mac, ce serait '/var/medqr/storage'
# Sur Windows, ce serait 'C:/medqr/storage'
file.upload.dir=/home/medqr_storage