# Application Name
spring.application.name=medqr-backend
# Base URL Configuration
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.name=${APP_NAME:MedQR}

# --- Database Configuration (PostgreSQL) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Driver is necessary, although often inferred
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate/JPA Configuration
# 'update' will create tables based on your Entities (Models)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate configuration to automatically convert from camelCase to snake_case from model to DB
spring.jpa.hibernate.naming.physical-strategy=com.medqr.backend.config.jpa.CustomPhysicalNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy

# --- JWT Security Configuration (Example, to be completed in security/) ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}

# --- SMTP Configuration for Email Sending ---
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true

# Configuration for port 587 with STARTTLS (recommended for cloud platforms)
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Timeouts
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

# SSL/TLS trust configuration
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST}
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

# Path for storing medical files
# On Linux/Mac, it would be '/var/medqr/storage'
# On Windows, it would be 'C:/medqr/storage'
file.upload.dir=/home/medqr_storage

# File size limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
