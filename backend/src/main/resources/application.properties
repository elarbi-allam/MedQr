spring.application.name=medqr-backend
# --- Configuration de la Base de Données (PostgreSQL) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Le driver est nécessaire, bien que souvent déduit
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration d'Hibernate/JPA
# 'update' va créer les tables basées sur vos Entités (Models)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#configuration de hibernate bax t7awl mn camelCase l snack_case automatiquement mn l model l DB
# NOUVELLE CONFIGURATION : Utilise la stratégie qui applique snake_case par défaut
spring.jpa.hibernate.naming.physical-strategy=com.medqr.backend.config.jpa.CustomPhysicalNamingStrategy
# Vous pouvez conserver la stratégie implicite, mais elle est souvent omise
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
# --- Configuration de Sécurité JWT (Exemple, à compléter dans security/) ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}


# --- Configuration SMTP pour l'Envoi d'Emails ---
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${UserP}
spring.mail.password=${PassP}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true