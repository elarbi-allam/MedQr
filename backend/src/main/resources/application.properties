spring.application.name=medqr-backend
# --- Configuration de la Base de Données (PostgreSQL) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Le driver est nécessaire, bien que souvent déduit
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration d'Hibernate/JPA
# 'update' va créer les tables basées sur vos Entités (Models)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Configuration de Sécurité JWT (Exemple, à compléter dans security/) ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}